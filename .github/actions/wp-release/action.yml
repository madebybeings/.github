name: "WP Plugin/Theme Release"
description: "Build a clean WordPress plugin or theme ZIP from a tagged commit and attach it to the GitHub Release. Single source of truth for the Beings WP fleet."

inputs:
  slug:
    description: "Plugin/theme slug — becomes the ZIP name and the top-level folder inside it (must match the install folder WP expects)."
    required: true
  node-version:
    description: "Node version to use when the repo has a package.json build step."
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Detect build tooling
      id: detect
      shell: bash
      run: |
        if [ -f package.json ]; then echo "has_npm=true" >> "$GITHUB_OUTPUT"; else echo "has_npm=false" >> "$GITHUB_OUTPUT"; fi
        if [ -f composer.json ]; then echo "has_composer=true" >> "$GITHUB_OUTPUT"; else echo "has_composer=false" >> "$GITHUB_OUTPUT"; fi

    - name: Setup Node
      if: steps.detect.outputs.has_npm == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: npm install & build
      if: steps.detect.outputs.has_npm == 'true'
      shell: bash
      run: |
        npm ci
        # Run the build script only if one is defined.
        if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
          npm run build
        else
          echo "No build script defined — skipping."
        fi

    - name: composer install (no-dev)
      if: steps.detect.outputs.has_composer == 'true'
      shell: bash
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Build distribution ZIP
      shell: bash
      run: |
        set -eu
        SLUG="${{ inputs.slug }}"
        STAGING="${RUNNER_TEMP}/wp-dist/${SLUG}"
        rm -rf "$STAGING"
        mkdir -p "$STAGING"

        # Hard excludes always apply. Per-repo .distignore (WP-standard) adds the rest.
        EXCLUDES=(--exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='*.zip')
        if [ -f .distignore ]; then
          EXCLUDES+=(--exclude-from='.distignore')
        fi

        rsync -a ./ "$STAGING/" "${EXCLUDES[@]}"

        cd "${RUNNER_TEMP}/wp-dist"
        zip -rq "${GITHUB_WORKSPACE}/${SLUG}.zip" "${SLUG}"
        echo "Built ${SLUG}.zip:"
        unzip -l "${GITHUB_WORKSPACE}/${SLUG}.zip" | tail -n +2 | head -n 40

    - name: Attach ZIP to release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ inputs.slug }}.zip
        fail_on_unmatched_files: true
